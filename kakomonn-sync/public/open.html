<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b12">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="FSRSに基づく次の過去問へ移動します">
    <title>次の問題へ | KAKOMONN</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">KAKOMONN / NEXT QUESTION</p>
          <h1>次の問題へ</h1>
        </div>
      </header>

      <main>
        <section class="panel" aria-labelledby="next-question-title">
          <p class="eyebrow">SCHEDULING</p>
          <h2 id="next-question-title">次に解く問題を確認しています</h2>
          <p id="next-question-status" class="message" role="status" aria-live="polite">
            問題を取得しています.
          </p>
          <p class="muted">
            自動で移動しない場合は, iPhone SafariのTampermonkeyで過去問readerを最新版へ更新してください.
          </p>
          <form action="/open" method="get">
            <button id="next-question-retry" class="text-button" type="submit" hidden>再試行</button>
          </form>
          <noscript>
            <p class="message" role="alert">JavaScriptを有効にしてください.</p>
          </noscript>
        </section>
      </main>
    </div>
  </body>
</html>
