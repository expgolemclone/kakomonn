<!doctype html>
<html lang="ja" data-state="loading">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="50問ごとの達成をランダムな作品で祝うページ">
    <title>50問達成</title>
    <link rel="stylesheet" href="./shell.css">
  </head>
  <body>
    <main class="stage">
      <p id="loading" class="loading" role="status">祝福を選んでいます...</p>
      <iframe
        id="celebration-frame"
        title="ランダムに選ばれた祝福ページ"
        referrerpolicy="no-referrer"
      ></iframe>
    </main>

    <aside class="study-log-ticket" aria-label="週間の学習記録">
      <span id="milestone-label" class="milestone-label"></span>
      <button id="open-study-log" class="study-log-button" type="button">週間の記録を見る</button>
    </aside>

    <section id="error-panel" class="error-panel" role="alert" hidden>
      <h1>祝福ページを開けません</h1>
      <p></p>
    </section>

    <script type="module" src="./router.js"></script>
  </body>
</html>
