name: Release kakomonn-reader

on:
  push:
    branches:
      - main
    paths:
      - "kakomonn-reader/src/**"
      - "kakomonn-reader/build.py"
      - "kakomonn-reader/tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-kakomonn-reader.yml"
  pull_request:
    paths:
      - "kakomonn-reader/src/**"
      - "kakomonn-reader/build.py"
      - "kakomonn-reader/tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/release-kakomonn-reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix congratulations
          npx playwright install --with-deps chromium webkit

      - name: Run tests
        run: |
          npm test
          npm run test:smoke
          node kakomonn-reader/tests/live_site_e2e_test.js

  ios-safari:
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Boot iOS 26 simulator
        run: |
          device_udid="$(node kakomonn-reader/tests/select_ios_simulator.js)"
          xcrun simctl shutdown all
          xcrun simctl boot "$device_udid"
          xcrun simctl bootstatus "$device_udid" -b
          open -a Simulator --args -CurrentDeviceUDID "$device_udid"
          echo "IOS_SAFARI_DEVICE_UDID=$device_udid" >> "$GITHUB_ENV"

      - name: Run iOS Safari E2E
        run: npm run test:kakomonn-ios-safari

      - name: Upload iOS Safari diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kakomonn-ios-safari-diagnostics
          path: |
            kakomonn-reader/test-results/
          if-no-files-found: ignore

      - name: Shut down iOS simulator
        if: always()
        run: |
          if [[ -n "${IOS_SAFARI_DEVICE_UDID:-}" ]]; then
            xcrun simctl shutdown "$IOS_SAFARI_DEVICE_UDID"
          fi

  release:
    if: github.event_name != 'pull_request'
    needs:
      - test
      - ios-safari
    permissions:
      contents: write
    concurrency:
      group: release-kakomonn-reader
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build release asset
        run: python3 kakomonn-reader/build.py

      - name: Create release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="kakomonn-reader-${GITHUB_SHA}"
          release_title="kakomonn-reader ${GITHUB_SHA:0:12}"
          release_notes="Built from commit [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
          default_branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"

          if [[ "$GITHUB_SHA" == "$default_branch_sha" ]]; then
            latest_option=(--latest)
          else
            latest_option=(--latest=false)
          fi

          gh release create "$release_tag" \
            kakomonn-reader/kakomonn-reader.user.js \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            "${latest_option[@]}"
