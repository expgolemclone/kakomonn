<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef5f5">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="中小企業診断士試験の過去問正解数と解答数を週と月で振り返る学習ログ">
    <title>過去問 学習ログ</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div>
          <p class="subject-label">中小企業診断士試験</p>
          <h1><span>過去問</span> 学習ログ</h1>
        </div>
        <button id="settings-button" class="text-button" type="button" hidden>
          同期設定
        </button>
      </header>

      <main>
        <section id="auth-panel" class="auth-panel" aria-labelledby="auth-title">
          <p class="section-label">最初の設定</p>
          <h2 id="auth-title">学習記録を開く</h2>
          <p class="auth-description">
            過去問readerで使っている同期tokenを入力します. tokenはこのbrowserだけに保存します.
          </p>
          <form id="auth-form" novalidate>
            <label for="auth-token">同期token</label>
            <div class="token-row">
              <input
                id="auth-token"
                name="token"
                type="password"
                autocomplete="current-password"
                spellcheck="false"
                required
              >
              <button id="auth-submit" class="primary-button" type="submit">記録を開く</button>
            </div>
          </form>
          <p id="auth-message" class="form-message" role="alert"></p>
        </section>

        <section id="dashboard" class="ledger" aria-labelledby="period-title" hidden>
          <div class="ledger-controls">
            <div class="view-switch" role="group" aria-label="表示期間">
              <button id="week-view" type="button" aria-pressed="true">週</button>
              <button id="month-view" type="button" aria-pressed="false">月</button>
            </div>
            <div class="period-navigation">
              <button id="previous-period" class="icon-button" type="button" aria-label="前の期間">←</button>
              <h2 id="period-title"></h2>
              <button id="next-period" class="icon-button" type="button" aria-label="次の期間">→</button>
            </div>
            <div class="period-actions">
              <button id="today-button" class="text-button" type="button">今日へ</button>
              <button id="refresh-button" class="text-button" type="button">再読み込み</button>
            </div>
          </div>

          <dl class="period-summary" aria-label="選択期間の集計">
            <div>
              <dt>合計(問)</dt>
              <dd>
                <span class="summary-primary">
                  <strong id="total-count">--</strong><small>正解</small>
                </span>
                <span class="summary-reference">
                  <strong id="total-answered">--</strong><small>解答</small>
                </span>
              </dd>
            </div>
            <div>
              <dt>1日平均(問)</dt>
              <dd>
                <span class="summary-primary">
                  <strong id="average-count">--</strong><small>正解</small>
                </span>
                <span class="summary-reference">
                  <strong id="average-answered">--</strong><small>解答</small>
                </span>
              </dd>
            </div>
            <div class="summary-note">
              <dt>集計期間</dt>
              <dd id="tracking-note"></dd>
            </div>
          </dl>

          <figure class="chart-figure" aria-labelledby="chart-caption">
            <figcaption id="chart-caption">
              <span>日ごとの学習記録</span>
              <span class="chart-legend" aria-label="graphの凡例">
                <span><i class="legend-correct" aria-hidden="true"></i>正解</span>
                <span><i class="legend-answered" aria-hidden="true"></i>解答</span>
              </span>
            </figcaption>
            <div id="chart-scroller" class="chart-scroller" tabindex="0" aria-label="正解数と解答数graph">
              <div id="chart-frame" class="chart-frame">
                <div class="scale" aria-hidden="true">
                  <span id="scale-maximum">--</span>
                  <span id="scale-middle">--</span>
                  <span>0</span>
                </div>
                <div class="plot">
                  <div class="grid-lines" aria-hidden="true"><i></i><i></i><i></i></div>
                  <ol id="bar-chart" class="bar-chart"></ol>
                </div>
              </div>
            </div>
            <p id="day-detail" class="day-detail" aria-live="polite"></p>
            <p id="empty-message" class="empty-message" hidden>
              この期間はまだ解答記録がありません. 過去問を解くと, ここに棒が立ちます.
            </p>
          </figure>
          <p id="dashboard-status" class="dashboard-status" role="status" aria-live="polite"></p>
        </section>

        <section id="load-error" class="error-panel" aria-labelledby="error-title" hidden>
          <p class="section-label">読込みerror</p>
          <h2 id="error-title">学習記録を表示できません</h2>
          <p id="error-message"></p>
          <button id="retry-button" class="primary-button" type="button">再読み込み</button>
        </section>
      </main>

      <footer>
        <p>正解数と解答数は日本時間で記録します.</p>
      </footer>
    </div>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" method="dialog" novalidate>
        <button id="settings-close" class="dialog-close" type="button" aria-label="同期設定を閉じる">×</button>
        <p class="section-label">この端末の設定</p>
        <h2 id="settings-title">同期token</h2>
        <label for="settings-token">新しい同期token</label>
        <input
          id="settings-token"
          name="token"
          type="password"
          autocomplete="current-password"
          spellcheck="false"
        >
        <p id="settings-message" class="form-message" role="alert"></p>
        <div class="dialog-actions">
          <button id="forget-token" class="danger-button" type="button">この端末から削除</button>
          <button id="save-token" class="primary-button" type="submit">tokenを変更</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
