name: Live kakomonn E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-site-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 kakomonn-reader/build.py
      - name: Run live site E2E
        shell: bash
        run: |
          set -o pipefail
          node kakomonn-reader/tests/live_site_e2e_test.js 2>&1 | tee live-e2e.log
      - name: Upload live E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-log
          path: live-e2e.log
          if-no-files-found: error
