<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a1018" />
    <meta
      name="description"
      content="祝砲鬼ゴウテンが四股で学習の節目を祝う, ダークモードの祝福ページ."
    />
    <title>祝砲鬼ゴウテンの勝ち四股</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="arena" data-gouten-stage data-ready="false">
      <div class="arena-glow" aria-hidden="true"></div>
      <div class="ring-lines" aria-hidden="true"></div>
      <div class="impact-field" aria-hidden="true">
        <span class="impact-ring impact-ring-a"></span>
        <span class="impact-ring impact-ring-b"></span>
        <span class="impact-ring impact-ring-c"></span>
      </div>
      <div class="talisman-field" data-talismans aria-hidden="true"></div>

      <header class="broadcast-strip">
        <span>黒土俵特別取組</span>
        <span class="broadcast-live"><i></i> ACHIEVEMENT BOUT</span>
        <span>一人横綱興行</span>
      </header>

      <section class="copy-panel" aria-labelledby="celebration-title">
        <p class="eyebrow">BLACK DOHYO / VICTORY CEREMONY</p>
        <h1 id="celebration-title">
          <span class="count-line"><b data-milestone>50</b>問,</span>
          <span>踏み抜いた.</span>
        </h1>
        <p class="lead">
          正解も, 間違いも, 全部ここまで運んできた.
          今夜は祝砲鬼ゴウテンが, あなたの積み上げを土俵ごと揺らす.
        </p>
        <button class="stomp-button" type="button" data-replay>
          <span class="button-kicker">ENCORE</span>
          <strong>もう一丁, 踏め!</strong>
          <span class="button-mark" aria-hidden="true">ドン</span>
        </button>
      </section>

      <section class="dohyo-scene" aria-label="祝砲鬼ゴウテンの勝ち四股">
        <div class="rope rope-back" aria-hidden="true"></div>
        <div class="corner-post post-left" aria-hidden="true"></div>
        <div class="corner-post post-right" aria-hidden="true"></div>

        <p class="character-tag">
          <span>祝砲鬼</span>
          <strong>GOUTEN</strong>
          <small>THE STOMPER OF SMALL VICTORIES</small>
        </p>

        <figure class="gouten-figure" data-character>
          <svg
            class="gouten"
            viewBox="0 0 620 720"
            role="img"
            aria-labelledby="gouten-title gouten-desc"
          >
            <title id="gouten-title">祝砲鬼ゴウテン</title>
            <desc id="gouten-desc">
              三つ目の鬼力士が片足を高く上げ, 両腕を振り上げて勝ち四股を踏もうとしている.
            </desc>
            <defs>
              <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#d99572" />
                <stop offset="0.48" stop-color="#bd684f" />
                <stop offset="1" stop-color="#7f3a35" />
              </linearGradient>
              <linearGradient id="mawashi" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#d4b06d" />
                <stop offset="0.5" stop-color="#7e5b2e" />
                <stop offset="1" stop-color="#2f271d" />
              </linearGradient>
              <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#293946" />
                <stop offset="1" stop-color="#070b10" />
              </linearGradient>
              <radialGradient id="eyeGlow">
                <stop offset="0" stop-color="#effbf6" />
                <stop offset="0.45" stop-color="#8fd3c7" />
                <stop offset="1" stop-color="#8fd3c7" stop-opacity="0" />
              </radialGradient>
              <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
                <feGaussianBlur stdDeviation="12" />
              </filter>
            </defs>

            <ellipse class="floor-shadow" cx="315" cy="654" rx="222" ry="38" />
            <circle cx="307" cy="245" r="148" fill="url(#eyeGlow)" opacity="0.13" filter="url(#softGlow)" />

            <g class="raised-leg">
              <path d="M378 488 C430 470 484 433 520 377 C548 334 570 338 588 369 C605 399 590 429 560 458 C523 493 474 528 420 552 Z" fill="url(#skin)" stroke="#4d2928" stroke-width="7" />
              <path d="M525 383 C554 351 583 347 600 369 C617 392 604 422 578 438 C550 454 522 440 511 419 Z" fill="#9b4b40" stroke="#4d2928" stroke-width="7" />
              <path d="M559 365 C574 351 595 354 604 368" fill="none" stroke="#e5ad82" stroke-width="8" stroke-linecap="round" />
            </g>

            <g class="body-group">
              <path d="M182 314 C193 243 241 199 306 196 C376 193 426 239 438 316 L468 523 C434 575 376 601 309 602 C239 602 183 575 151 525 Z" fill="url(#skin)" stroke="#4d2928" stroke-width="8" />
              <path d="M187 332 C215 366 253 385 307 387 C362 389 405 367 433 330" fill="none" stroke="#e3a17a" stroke-width="10" stroke-linecap="round" opacity="0.42" />
              <path d="M197 493 C245 467 369 467 421 495 L441 548 C383 580 234 582 174 546 Z" fill="url(#mawashi)" stroke="#2d241b" stroke-width="8" />
              <path d="M259 487 L355 487 L370 578 L246 578 Z" fill="#b58a4d" stroke="#4e3a21" stroke-width="7" />
              <path d="M274 493 L337 493 L330 572 L280 572 Z" fill="#1b2328" opacity="0.72" />
              <path d="M307 208 C274 195 252 165 254 131 C258 89 291 63 330 66 C372 68 400 100 397 140 C394 177 366 204 334 211 Z" fill="url(#skin)" stroke="#4d2928" stroke-width="8" />
              <path d="M259 122 C269 78 308 49 350 57 C387 64 412 96 405 136 C382 111 356 100 330 103 C307 106 285 116 259 122 Z" fill="url(#hair)" />
              <path d="M274 80 L261 28 L300 67 Z" fill="#d7c49c" stroke="#493d31" stroke-width="6" />
              <path d="M381 84 L404 34 L410 87 Z" fill="#d7c49c" stroke="#493d31" stroke-width="6" />
              <ellipse cx="304" cy="136" rx="14" ry="10" fill="#f0ead9" />
              <ellipse cx="353" cy="136" rx="14" ry="10" fill="#f0ead9" />
              <ellipse cx="329" cy="103" rx="12" ry="9" fill="#f0ead9" />
              <circle cx="304" cy="137" r="5" fill="#10252a" />
              <circle cx="353" cy="137" r="5" fill="#10252a" />
              <circle cx="329" cy="104" r="4" fill="#10252a" />
              <path d="M298 174 Q329 199 362 171" fill="none" stroke="#592f31" stroke-width="9" stroke-linecap="round" />
              <path d="M314 176 L323 192 L332 175" fill="#f3e7d4" />
              <path d="M339 176 L347 191 L355 173" fill="#f3e7d4" />
            </g>

            <g class="arms">
              <path d="M203 312 C150 297 109 258 79 207" fill="none" stroke="#a95647" stroke-width="70" stroke-linecap="round" />
              <path d="M414 309 C464 287 499 245 520 192" fill="none" stroke="#a95647" stroke-width="70" stroke-linecap="round" />
              <path d="M80 211 C56 199 44 173 55 151 C68 126 99 125 116 146 C132 166 118 204 95 214 Z" fill="url(#skin)" stroke="#4d2928" stroke-width="7" />
              <path d="M519 195 C505 170 514 143 538 132 C565 120 590 139 587 166 C584 193 550 214 527 203 Z" fill="url(#skin)" stroke="#4d2928" stroke-width="7" />
              <path d="M62 162 L35 134 M75 150 L62 113 M96 154 L99 116" fill="none" stroke="#e6ae83" stroke-width="9" stroke-linecap="round" />
              <path d="M546 145 L550 107 M561 151 L580 118 M573 164 L606 145" fill="none" stroke="#e6ae83" stroke-width="9" stroke-linecap="round" />
            </g>

            <g class="grounded-leg">
              <path d="M207 556 C186 591 174 630 178 670 L272 670 C276 626 268 588 250 556 Z" fill="url(#skin)" stroke="#4d2928" stroke-width="8" />
              <path d="M168 659 C187 641 237 642 271 660 L277 688 L158 688 Z" fill="#815047" stroke="#4d2928" stroke-width="7" />
            </g>

            <g class="face-marks" fill="none" stroke="#8fd3c7" stroke-width="5" stroke-linecap="round" opacity="0.78">
              <path d="M276 148 L255 158" />
              <path d="M381 146 L402 157" />
              <path d="M329 78 L329 63" />
            </g>
          </svg>
          <figcaption>
            <span>三眼, 二本角, 一発入魂.</span>
            <strong>勝ち四股専門.</strong>
          </figcaption>
        </figure>

        <div class="dohyo" aria-hidden="true">
          <span class="salt salt-a"></span>
          <span class="salt salt-b"></span>
          <span class="salt salt-c"></span>
        </div>
        <div class="rope rope-front" aria-hidden="true"></div>
      </section>

      <aside class="victory-seal" aria-label="達成記録">
        <span>達</span>
        <strong data-milestone>50</strong>
        <small>QUESTIONS</small>
      </aside>

      <footer class="footer-note">
        <span>答えは静かでも, 達成は静かでなくていい.</span>
        <span>GOUTEN BOUT / KAKOMONN</span>
      </footer>
    </main>
  </body>
</html>
